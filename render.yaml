# SaloMed backend + persistent database for Render.
#
# Safe MVP deployment:
# - SALOMED_MODE=demo keeps real-money/on-chain mutation guarded.
# - DATABASE_URL is injected from managed Postgres so cross-user vault,
#   history, provider, and admin queues survive restarts and redeploys.

databases:
  - name: salomed-db
    plan: free

services:
  - type: web
    name: salomed-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/runtime
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: salomed-db
          property: connectionString
      - key: SALOMED_MODE
        value: stellar_testnet
      - key: SALOMED_ASSET_CODE
        value: XLM
      - key: PHP_PER_XLM
        value: "11.34"
      - key: PHP_PER_USDC
        value: "56.00"
      - key: STELLAR_NETWORK
        value: testnet
      - key: RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: CONTRACT_ID
        value: CA6X5ZJ24LBJBCRHSAJK5EXB7CMEED2X2JTDLTPBOZC3SM4ABZYNIRCG
      - key: SALOMED_EXPECTED_TOKEN_ID
        value: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
      - key: ADMIN_ADDRESS
        value: GBSXYPN2XWTJEZPLAMRIYQQVQTCJ2MEQOVOA3G73USGCMEXJ5YXPU2G7
      - key: SALOMED_CONTRACT_CONFIG_VERIFIED
        value: "true"
      - key: SALOMED_ADMIN_USERNAME
        sync: false
      - key: SALOMED_ADMIN_PASSWORD
        sync: false
      - key: SALOMED_ADMIN_SESSION_SECRET
        sync: false
      - key: SALOMED_SIGNER_SECRET
        sync: false
      - key: PDAX_BASE_URL
        value: https://uat.services.sandbox.pdax.ph/api/pdax-api
      - key: PDAX_USERNAME
        sync: false
      - key: PDAX_PASSWORD
        sync: false
      - key: PDAX_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
