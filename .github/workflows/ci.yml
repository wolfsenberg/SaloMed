name: SaloMed CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  contracts:
    name: Smart Contract CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the Soroban 25.x toolchain deterministic. Newer Linux Rust
      # releases can break older transitive deps such as ethnum.
      - name: Install Rust 1.91.0
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: wasm32v1-none

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/salomed/target
          key: ${{ runner.os }}-rust-1.91.0-cargo-${{ hashFiles('contracts/salomed/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-1.91.0-cargo-

      - name: Run contract tests
        working-directory: contracts/salomed
        run: cargo test --release

      - name: Build WASM artifact
        working-directory: contracts/salomed
        run: cargo build --target wasm32v1-none --release

      - name: Verify WASM size
        working-directory: contracts/salomed
        run: |
          WASM=target/wasm32v1-none/release/salomed.wasm
          SIZE=$(wc -c < "$WASM")
          echo "WASM size: ${SIZE} bytes"
          if [ "$SIZE" -gt 65536 ]; then
            echo "::warning::WASM exceeds 64 KB. Consider optimizing before deployment."
          fi

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: salomed-contract-wasm
          path: contracts/salomed/target/wasm32v1-none/release/salomed.wasm
          if-no-files-found: error

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build Next.js app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CONTRACT_ID: CA6X5ZJ24LBJBCRHSAJK5EXB7CMEED2X2JTDLTPBOZC3SM4ABZYNIRCG
          NEXT_PUBLIC_TOKEN_CONTRACT_ID: CDLZFC3SYJYDZT7K67VZ75HPJVIEUVNIXF47ZG2FB2RMQQVU2HHGCYSC
          NEXT_PUBLIC_ADMIN_ADDRESS: GBSXYPN2XWTJEZPLAMRIYQQVQTCJ2MEQOVOA3G73USGCMEXJ5YXPU2G7
          NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Syntax-check backend
        working-directory: backend
        run: python -m py_compile main.py runtime_api.py salomed_runtime.py

      - name: Verify FastAPI app loads
        working-directory: backend
        env:
          SALOMED_MODE: demo
          CONTRACT_ID: CA6X5ZJ24LBJBCRHSAJK5EXB7CMEED2X2JTDLTPBOZC3SM4ABZYNIRCG
          STELLAR_NETWORK: testnet
          STELLAR_SOURCE: salomed-admin
          ADMIN_ADDRESS: GBSXYPN2XWTJEZPLAMRIYQQVQTCJ2MEQOVOA3G73USGCMEXJ5YXPU2G7
          PHP_PER_XLM: "11.34"
          FRONTEND_ORIGIN: http://localhost:3000
          SALOMED_SIGNER_SECRET: ""
          PDAX_BASE_URL: https://uat.services.sandbox.pdax.ph/api/pdax-api
          PDAX_USERNAME: ""
          PDAX_PASSWORD: ""
        run: python -c "from main import app; print(f'FastAPI app loaded with {len(app.routes)} routes registered')"

      - name: Run backend tests
        working-directory: backend
        env:
          SALOMED_MODE: demo
        run: python -m pytest -q

      - name: Dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  deploy_backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [contracts, frontend, backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not configured. Skipping backend deployment."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment triggered."

  deploy_frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [contracts, frontend, backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK_URL is not configured. Skipping frontend deployment."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Vercel deployment triggered."
